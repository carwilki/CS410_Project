[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.16.0",
    "gguf>=0.19.0",
    "huggingface-hub>=2.4.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyserini>=2.4.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "textual>=8.2.8",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
